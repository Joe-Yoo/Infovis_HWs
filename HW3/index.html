<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>CS7450 - HW 2</title>
        <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💧</text></svg>">

        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main id="charts">
            <div id="top-section">
                <div id="top-controls">
                    <label for="top-month-select">Month</label>
                    <select id="top-month-select">
                        <option value="0">January</option>
                        <option value="1">February</option>
                        <option value="2">March</option>
                        <option value="3">April</option>
                        <option value="4">May</option>
                        <option value="5">June</option>
                        <option value="6">July</option>
                        <option value="7">August</option>
                        <option value="8">September</option>
                        <option value="9">October</option>
                        <option value="10">November</option>
                        <option value="11">December</option>
                    </select>
                    <label for="top-year-select">Year</label>
                    <select id="top-year-select">
                        <option value="2020">2020</option>
                        <option value="2021">2021</option>
                        <option value="2022">2022</option>
                    </select>
                </div>

                <div id="line-graph">
                    <h2>Daily Wind Speed by Month</h2>
                    <div id="line-graph-svg"></div>
                </div>

                <div id="pie-chart">
                    <h2>Weather Distribution by Month</h2>
                    <div id="pie-chart-svg"></div>
                </div>
            </div>

            <div id="bottom-section">
                <div id="bottom-controls">
                    <label for="box-year-select">Year</label>
                    <select id="box-year-select">
                        <option value="2020">2020</option>
                        <option value="2021">2021</option>
                        <option value="2022">2022</option>
                    </select>
                </div>

                <div id="box-plot">
                    <h2>Monthly High & Low Temperature Distribution</h2>
                    <div id="box-svg"></div>
                </div>

                <div id="calendar">
                    <h2>Daily Temperature Heatmap</h2>
                    <div id="calendar-svg"></div>
                </div>
            </div>
        </main>

        <script src="https://d3js.org/d3.v7.min.js"></script>
        <script src="script.js"></script>
        <script src="line_graph.js"></script>
        <script src="box_and_whiskers.js"></script>
        <script src="pie_chart.js"></script>
        <script src="calendar.js"></script>
    </body>
</html>
